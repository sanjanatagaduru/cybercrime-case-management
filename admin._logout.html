<!DOCTYPE html>
<html>
<head>
<title>Admin Logout</title>

<style>
body{
font-family: Arial;
background:#f4f4f4;
text-align:center;
margin:0;
}

header{
background:#0a3d62;
color:white;
padding:15px;
font-size:22px;
}

.container{
background:white;
width:350px;
margin:auto;
margin-top:100px;
padding:30px;
border-radius:10px;
box-shadow:0px 4px 10px rgba(0,0,0,0.2);
}

button{
padding:10px 15px;
margin:10px;
border:none;
border-radius:5px;
cursor:pointer;
font-size:14px;
}

.logout-btn{
background:#dc3545;
color:white;
}

.logout-btn:hover{
background:#c82333;
}

.cancel-btn{
background:#007BFF;
color:white;
}

.cancel-btn:hover{
background:#0056b3;
}
</style>

<script>

/* =========================
   ADMIN SECURE LOGOUT
========================= */

function logoutAdmin(){

    let token =
    localStorage.getItem("token");

    fetch("http://localhost:3000/adminLogout",{

        method:"POST",

        headers:{

            "Content-Type":"application/json",

            "Authorization":"Bearer " + token

        }

    })

    .then(res => res.json())

    .then(data => {

        if(data.success){

            /* CLEAR STORAGE */

            localStorage.removeItem("token");
            localStorage.removeItem("admin_id");

            sessionStorage.clear();

            alert("Logout Successful");

            window.location.href =
            "AdminLogin.html";

        }

    });

}

/* =========================
   RETURN TO DASHBOARD
========================= */

function returnDashboard(){

    window.location.href =
    "AdminDashboard.html";
}

/* =========================
   SESSION CHECK
========================= */

window.onload = function(){

    let token =
    localStorage.getItem("token");

    if(!token){

        alert("Session Expired");

        window.location.href =
        "AdminLogin.html";
    }

}

</script>

</head>

<body>

<header>Cybercrime Case Management Portal</header>

<div class="container">

<h2>Admin Logout</h2>

<p>Are you sure you want to log out of the admin system?</p>

<br>

<button class="logout-btn"
onclick="logoutAdmin()">
Yes, Logout
</button>

<br>

<button class="cancel-btn"
onclick="returnDashboard()">
No, Return to Dashboard
</button>

</div>

</body>
</html>
