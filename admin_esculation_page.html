<!DOCTYPE html>
<html>
<head>
<title>Escalated Cases - Admin</title>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    text-align:center;
}

h2{
    color:navy;
}

table{
    width:95%;
    margin:auto;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid gray;
    padding:10px;
}

th{
    background:navy;
    color:white;
}

button{
    background:green;
    color:white;
    border:none;
    padding:6px 12px;
    cursor:pointer;
}

button:hover{
    background:darkgreen;
}
a{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:darkblue;
    color:white;
    text-decoration:none;
}

</style>

</head>

<body>

<h2>Escalated Cases (Admin Panel)</h2>

<table>
<thead>
<tr>
    <th>Complaint ID</th>
    <th>Investigator ID</th>
    <th>Reason</th>
    <th>Escalation Type</th>
    <th>Status</th>
    <th>Assign</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

<script>
    let token = localStorage.getItem("token");

/* ---------- CHECK LOGIN ---------- */

if(!token){

    alert("Please Login First");

    window.location.href = "admin_login.html";

}

// LOAD ESCALATED CASES
function loadEscalations(){

fetch("http://localhost:3000/allEscalations",{
    headers:{
        "Authorization":"Bearer " + token
    }
})

.then(res => res.json())
.then(data => {

let table = document.getElementById("table");
table.innerHTML = "";

if(!data || data.length === 0){
    table.innerHTML = "<tr><td colspan='6'>No escalations found</td></tr>";
    return;
}

data.forEach(e => {

table.innerHTML += `
<tr>
<td>${e.complaint_id}</td>
<td>${e.investigator_id}</td>
<td>${e.reason}</td>
<td>${e.type}</td>
<td>${e.status || "Pending"}</td>

<td>
<button onclick="assignCase('${e.complaint_id}', this)">
Assign
</button>
</td>

</tr>
`;

});

})
.catch(err => {
    console.error(err);
    alert("Error loading escalations");
});

}

function assignCase(complaint_id){ localStorage.setItem("assign_complaint_id", complaint_id); 
 window.location.href = "admin_Assign_complaints.html?cid=" + complaint_id; }
// INITIAL LOAD
loadEscalations();

</script>
<a href="admin_dashboard.html">
Back to Dashboard
</a>

</body>
</html>
