<!DOCTYPE html>
<html>
<head>
<title>Feedback</title>

<style>
body{
    font-family: Arial;
    background:#f2f2f2;
    text-align:center;
}

.container{
    background:white;
    width:450px;
    margin:auto;
    padding:20px;
    margin-top:30px;
    border-radius:10px;
}

h2{
    color:navy;
}

input, textarea, select{
    width:90%;
    padding:8px;
    margin:10px;
}

button{
    padding:10px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h2>System Feedback</h2>

<form onsubmit="submitFeedback(); return false;">

<input type="text" placeholder="Your Name (Optional)"><br>

<input type="email" placeholder="Your Email (Optional)"><br>

<select required>
    <option value="">Rate the System</option>
    <option>Excellent</option>
    <option>Good</option>
    <option>Average</option>
    <option>Poor</option>
</select><br>

<textarea placeholder="What do you like about the system?" required></textarea><br>

<textarea placeholder="Where do you think the system is lacking?" required></textarea><br>

<textarea placeholder="Suggestions for improvement"></textarea><br>

<button type="submit">Submit Feedback</button>

</form>

</div>

<script>
function submitFeedback(){
    alert("Thank you! Your feedback has been submitted.");
}
</script>

</body>
</html>
